[package]
name = "spyglass"
description = "An extensible TUI search tool"
version = "3.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/indium114/spyglass"
homepage = "https://github.com/indium114/spyglass"

[features]
default = [
  "apps",
  "calc",
  "clipboard",
  "nerdfont", # TODO
  "power",
  "process",
  "web",
]
apps = []
calc = []
clipboard = []
nerdfont = []
power = []
process = []
web = []

[dependencies]
color-eyre = "0.6.5"
dirs = "7.0.0"
image = "0.25.10"
mlua = { version = "0.12.3", features = ["lua55", "serde", "vendored"] }
ratatui = "0.30.2"
ratatui-image = "11.1.0"
ratatui-textarea = "0.9.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
