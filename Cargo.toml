[package]
name = "spyglass"
description = "An extensible TUI search tool"
version = "2.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/indium114/spyglass"
homepage = "https://github.com/indium114/spyglass"

[dependencies]
color-eyre = "0.6.5"
dirs = "6.0.0"
exp-rs = "0.2.0"
libc = "0.2.189"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.4"
url-escape = "0.1.2"
